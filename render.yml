services:
  - type: web
    name: bundles
    env: ruby
    buildCommand: "bundle install && bundle exec rails assets:precompile && bin/rails db:migrate RAILS_ENV=production"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: bundles-db
          property: connectionString
    plan: free

databases:
  - name: bundles-db
    databaseName: bundles
    user: bundles
    plan: free
